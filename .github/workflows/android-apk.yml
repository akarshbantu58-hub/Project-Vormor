name: WILD HORIZON - Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-horizon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Android game
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Report game asset footprint
        shell: bash
        run: |
          echo "Current source asset sizes:"
          if [ -d app/src/main/assets ]; then
            du -sh app/src/main/assets
            find app/src/main/assets -type f -printf '%s %p\n' | sort -nr | head -20
          else
            echo "No app/src/main/assets directory found."
          fi

      - name: Create temporary Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests (non-blocking)
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Report APK size and performance target
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          SIZE_BYTES="$(stat -c%s "$APK")"
          SIZE_GB="$(awk -v n="$SIZE_BYTES" 'BEGIN { printf "%.3f", n/1000000000 }')"
          echo "APK: $APK"
          echo "APK size: $SIZE_GB GB ($SIZE_BYTES bytes)"
          echo "Product targets: 4-8 GB installed game content; up to 4K assets on supported hardware; 60 FPS target on capable devices."
          echo "These are product targets, not build guarantees. This workflow does not pad the APK or claim device performance."
          if [ "$SIZE_BYTES" -gt 4000000000 ]; then
            echo "::warning::APK exceeds 4 GB. Use asset packs / Play Asset Delivery or split downloadable content."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WILD-HORIZON-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILD-HORIZON-build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
